server {
    listen 80;
    server_name ctmb.haogre.com;

    root /var/www/ctmb;
    index index.html;

    # Correct content type for the web manifest
    types { application/manifest+json webmanifest; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # SEO files — explicit, short cache
    location = /robots.txt   { expires 1d;  add_header Cache-Control "public, max-age=86400"; }
    location = /sitemap.xml  { expires 1h;  add_header Cache-Control "public, max-age=3600";  }
    location = /site.webmanifest { default_type application/manifest+json; expires 7d; }

    # Long-cache static assets (screenshots, og image, icons)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Security headers (Cloudflare terminates TLS)
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-XSS-Protection "1; mode=block";
}
